<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 20px; font-weight: bold; fill: #1e293b; }
      .subtitle { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 13px; fill: #64748b; }
      .box-label { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 600; }
      .box-desc { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 11px; fill: #475569; }
      .section-title { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 13px; font-weight: bold; fill: #334155; text-transform: uppercase; letter-spacing: 0.05em; }
      .arrow-text { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 11px; fill: #0284c7; font-weight: 500; }
      .mono { font-family: Consolas, 'Courier New', monospace; font-size: 11px; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0284c7" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10b981" />
    </marker>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#94a3b8" />
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.08" />
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="#f8fafc" rx="8" />
  
  <rect x="0" y="0" width="1000" height="64" fill="#ffffff" rx="8" />
  <line x1="0" y1="64" x2="1000" y2="64" stroke="#e2e8f0" stroke-width="1.5" />
  <circle cx="36" cy="32" r="14" fill="#3b82f6" />
  <text x="36" y="37" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="bold" fill="#ffffff">G</text>
  <text x="64" y="30" class="title">GymFit &bull; Production Cloud Deployment Architecture</text>
  <text x="64" y="48" class="subtitle">Multi-Gym Fitness Tracking &amp; Gym Management SaaS Platform</text>

  
  <rect x="50" y="90" width="900" height="90" rx="8" fill="#f8fafc" stroke="#cbd5e1" />
  <text x="70" y="115" class="section-title">1. Client Devices &amp; Physical Access</text>

  <rect x="80" y="130" width="240" height="38" rx="4" fill="#ffffff" stroke="#cbd5e1" />
  <text x="200" y="154" text-anchor="middle" class="box-desc" font-weight="600">Mobile Browsers (PWA - Members)</text>

  <rect x="360" y="130" width="260" height="38" rx="4" fill="#ffffff" stroke="#cbd5e1" />
  <text x="490" y="154" text-anchor="middle" class="box-desc" font-weight="600">Desktop Web (Owners &amp; Admins)</text>

  <rect x="660" y="130" width="260" height="38" rx="4" fill="#ffffff" stroke="#cbd5e1" />
  <text x="790" y="154" text-anchor="middle" class="box-desc" font-weight="600">Front-Desk Tablets / QR Scanners</text>

  <line x1="500" y1="180" x2="500" y2="215" stroke="#0284c7" stroke-width="2" marker-end="url(#arrow)" />
  <text x="510" y="202" class="arrow-text">HTTPS / TLS 1.3 Termination</text>

  <rect x="50" y="220" width="900" height="90" rx="8" fill="#eff6ff" stroke="#93c5fd" />
  <text x="70" y="245" class="section-title" fill="#1d4ed8">2. Edge &amp; Web Tier (Cloudflare + Nginx)</text>

  <rect x="80" y="260" width="380" height="38" rx="4" fill="#ffffff" stroke="#93c5fd" />
  <text x="270" y="284" text-anchor="middle" class="box-desc" font-weight="600">Cloudflare WAF / CDN (DDoS Defense &amp; Caching)</text>

  <rect x="500" y="260" width="420" height="38" rx="4" fill="#ffffff" stroke="#93c5fd" />
  <text x="710" y="284" text-anchor="middle" class="box-desc" font-weight="600">Nginx Container (Static React Assets + Reverse Proxy)</text>

  <line x1="500" y1="310" x2="500" y2="345" stroke="#0284c7" stroke-width="2" marker-end="url(#arrow)" />
  <text x="510" y="332" class="arrow-text">Internal Network Proxy Pass (:8080)</text>

  <rect x="50" y="350" width="900" height="90" rx="8" fill="#fdf4ff" stroke="#f0abfc" />
  <text x="70" y="375" class="section-title" fill="#a21caf">3. Application Server Tier (Spring Boot Container)</text>

  <rect x="80" y="390" width="840" height="38" rx="4" fill="#ffffff" stroke="#f0abfc" />
  <text x="500" y="414" text-anchor="middle" class="box-desc" font-weight="600">GymFit Spring Boot App (Eclipse Temurin JDK 21 LTS &bull; Modular Monolith Runtime)</text>

  <line x1="500" y1="440" x2="500" y2="475" stroke="#0284c7" stroke-width="2" marker-end="url(#arrow)" />
  <text x="510" y="462" class="arrow-text">HikariCP JDBC Connection Pool</text>

  <rect x="50" y="480" width="900" height="150" rx="8" fill="#ecfdf5" stroke="#6ee7b7" />
  <text x="70" y="505" class="section-title" fill="#047857">4. Managed Relational Database Tier (MySQL 8.x)</text>

  <rect x="80" y="520" width="380" height="90" rx="6" fill="#ffffff" stroke="#6ee7b7" />
  <text x="270" y="548" text-anchor="middle" class="box-label" fill="#065f46">Primary MySQL 8.x (Master)</text>
  <text x="270" y="570" text-anchor="middle" class="box-desc">Read / Write Transaction Processing</text>
  <text x="270" y="588" text-anchor="middle" class="box-desc">Automated Daily Snapshots &amp; PITR</text>

  <line x1="460" y1="565" x2="535" y2="565" stroke="#10b981" stroke-width="2" stroke-dasharray="4 2" marker-end="url(#arrow-green)" />
  <text x="500" y="555" text-anchor="middle" class="mono" fill="#10b981">Replication</text>

  <rect x="540" y="520" width="380" height="90" rx="6" fill="#ffffff" stroke="#6ee7b7" />
  <text x="730" y="548" text-anchor="middle" class="box-label" fill="#065f46">Read Replica MySQL 8.x</text>
  <text x="730" y="570" text-anchor="middle" class="box-desc">Read-Only Analytics &amp; Reporting</text>
  <text x="730" y="588" text-anchor="middle" class="box-desc">Automated Failover High Availability</text>

</svg>