<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 20px; font-weight: bold; fill: #1e293b; }
      .subtitle { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 13px; fill: #64748b; }
      .box-label { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 600; }
      .box-desc { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 11px; fill: #475569; }
      .section-title { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 13px; font-weight: bold; fill: #334155; text-transform: uppercase; letter-spacing: 0.05em; }
      .arrow-text { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 11px; fill: #0284c7; font-weight: 500; }
      .mono { font-family: Consolas, 'Courier New', monospace; font-size: 11px; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0284c7" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10b981" />
    </marker>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#94a3b8" />
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.08" />
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="#f8fafc" rx="8" />
  
  <rect x="0" y="0" width="1000" height="64" fill="#ffffff" rx="8" />
  <line x1="0" y1="64" x2="1000" y2="64" stroke="#e2e8f0" stroke-width="1.5" />
  <circle cx="36" cy="32" r="14" fill="#3b82f6" />
  <text x="36" y="37" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="bold" fill="#ffffff">G</text>
  <text x="64" y="30" class="title">GymFit &bull; User Roles & Permission Boundaries</text>
  <text x="64" y="48" class="subtitle">Multi-Gym Fitness Tracking &amp; Gym Management SaaS Platform</text>

  
  <rect x="40" y="90" width="215" height="560" rx="8" fill="#ffffff" stroke="#3b82f6" stroke-width="2" filter="url(#shadow)" />
  <rect x="40" y="90" width="215" height="60" rx="8" fill="#eff6ff" />
  <text x="147" y="118" text-anchor="middle" class="box-label" fill="#1d4ed8">1. PLATFORM ADMIN</text>
  <text x="147" y="136" text-anchor="middle" class="box-desc">Global Multi-Tenant Authority</text>

  <text x="55" y="175" class="box-label" fill="#1e293b">Core Capabilities:</text>
  <text x="55" y="200" class="box-desc">&bull; Onboard Gym Tenants</text>
  <text x="55" y="225" class="box-desc">&bull; Configure SaaS Tiers</text>
  <text x="55" y="250" class="box-desc">&bull; Set Quotas (Members/Staff)</text>
  <text x="55" y="275" class="box-desc">&bull; Suspend / Activate Tenants</text>
  <text x="55" y="300" class="box-desc">&bull; View Platform MRR / ARR</text>
  <text x="55" y="325" class="box-desc">&bull; Audit System Security</text>

  <rect x="55" y="580" width="185" height="50" rx="4" fill="#f1f5f9" />
  <text x="147" y="600" text-anchor="middle" class="mono" font-weight="bold">gymId: NULL</text>
  <text x="147" y="618" text-anchor="middle" class="box-desc">Global Scope Across All Gyms</text>

  <rect x="275" y="90" width="215" height="560" rx="8" fill="#ffffff" stroke="#8b5cf6" stroke-width="2" filter="url(#shadow)" />
  <rect x="275" y="90" width="215" height="60" rx="8" fill="#f5f3ff" />
  <text x="382" y="118" text-anchor="middle" class="box-label" fill="#6d28d9">2. GYM OWNER</text>
  <text x="382" y="136" text-anchor="middle" class="box-desc">Tenant Business Authority</text>

  <text x="290" y="175" class="box-label" fill="#1e293b">Core Capabilities:</text>
  <text x="290" y="200" class="box-desc">&bull; Manage Gym &amp; Branches</text>
  <text x="290" y="225" class="box-desc">&bull; Create Membership Plans</text>
  <text x="290" y="250" class="box-desc">&bull; Onboard Members &amp; Staff</text>
  <text x="290" y="275" class="box-desc">&bull; Real-time Live Headcount</text>
  <text x="290" y="300" class="box-desc">&bull; Revenue &amp; Churn Reports</text>
  <text x="290" y="325" class="box-desc">&bull; Assign Clients to Trainers</text>

  <rect x="290" y="580" width="185" height="50" rx="4" fill="#f5f3ff" />
  <text x="382" y="600" text-anchor="middle" class="mono" font-weight="bold">gymId: EXACT MATCH</text>
  <text x="382" y="618" text-anchor="middle" class="box-desc">Scoped to Own Facility Only</text>

  <rect x="510" y="90" width="215" height="560" rx="8" fill="#ffffff" stroke="#ec4899" stroke-width="2" filter="url(#shadow)" />
  <rect x="510" y="90" width="215" height="60" rx="8" fill="#fdf2f8" />
  <text x="617" y="118" text-anchor="middle" class="box-label" fill="#be185d">3. TRAINER</text>
  <text x="617" y="136" text-anchor="middle" class="box-desc">Coach &amp; Fitness Instructor</text>

  <text x="525" y="175" class="box-label" fill="#1e293b">Core Capabilities:</text>
  <text x="525" y="200" class="box-desc">&bull; View Assigned Clients</text>
  <text x="525" y="225" class="box-desc">&bull; Build Workout Routines</text>
  <text x="525" y="250" class="box-desc">&bull; Assign Nutrition Plans</text>
  <text x="525" y="275" class="box-desc">&bull; Schedule &amp; Teach Classes</text>
  <text x="525" y="300" class="box-desc">&bull; Review PRs &amp; Progress</text>
  <text x="525" y="325" class="box-desc">&bull; Medical Notes Overview</text>

  <rect x="525" y="580" width="185" height="50" rx="4" fill="#fdf2f8" />
  <text x="617" y="600" text-anchor="middle" class="mono" font-weight="bold">gymId + Client Guard</text>
  <text x="617" y="618" text-anchor="middle" class="box-desc">Assigned Member Clients Only</text>

  <rect x="745" y="90" width="215" height="560" rx="8" fill="#ffffff" stroke="#10b981" stroke-width="2" filter="url(#shadow)" />
  <rect x="745" y="90" width="215" height="60" rx="8" fill="#ecfdf5" />
  <text x="852" y="118" text-anchor="middle" class="box-label" fill="#047857">4. MEMBER</text>
  <text x="852" y="136" text-anchor="middle" class="box-desc">Athletic End-User</text>

  <text x="760" y="175" class="box-label" fill="#1e293b">Core Capabilities:</text>
  <text x="760" y="200" class="box-desc">&bull; Digital QR Check-in Pass</text>
  <text x="760" y="225" class="box-desc">&bull; View Assigned Routines</text>
  <text x="760" y="250" class="box-desc">&bull; Log Sets, Reps &amp; Load</text>
  <text x="760" y="275" class="box-desc">&bull; Log Body Measurements</text>
  <text x="760" y="300" class="box-desc">&bull; Book Group Classes</text>
  <text x="760" y="325" class="box-desc">&bull; Invoices &amp; Membership</text>

  <rect x="760" y="580" width="185" height="50" rx="4" fill="#ecfdf5" />
  <text x="852" y="600" text-anchor="middle" class="mono" font-weight="bold">gymId + Self ID Guard</text>
  <text x="852" y="618" text-anchor="middle" class="box-desc">Personal Data Exclusively</text>

</svg>