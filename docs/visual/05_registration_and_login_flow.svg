<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 20px; font-weight: bold; fill: #1e293b; }
      .subtitle { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 13px; fill: #64748b; }
      .box-label { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 600; }
      .box-desc { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 11px; fill: #475569; }
      .section-title { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 13px; font-weight: bold; fill: #334155; text-transform: uppercase; letter-spacing: 0.05em; }
      .arrow-text { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 11px; fill: #0284c7; font-weight: 500; }
      .mono { font-family: Consolas, 'Courier New', monospace; font-size: 11px; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0284c7" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10b981" />
    </marker>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#94a3b8" />
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.08" />
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="#f8fafc" rx="8" />
  
  <rect x="0" y="0" width="1000" height="64" fill="#ffffff" rx="8" />
  <line x1="0" y1="64" x2="1000" y2="64" stroke="#e2e8f0" stroke-width="1.5" />
  <circle cx="36" cy="32" r="14" fill="#3b82f6" />
  <text x="36" y="37" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="bold" fill="#ffffff">G</text>
  <text x="64" y="30" class="title">GymFit &bull; User Registration & Stateless Login Flow</text>
  <text x="64" y="48" class="subtitle">Multi-Gym Fitness Tracking &amp; Gym Management SaaS Platform</text>

  
  <rect x="50" y="85" width="420" height="565" rx="8" fill="#f0fdfa" stroke="#5eead4" stroke-width="1.5" />
  <text x="70" y="115" class="section-title" fill="#0f766e">1. Member Registration Flow</text>

  <rect x="80" y="135" width="360" height="40" rx="6" fill="#ffffff" stroke="#99f6e4" />
  <text x="260" y="160" text-anchor="middle" class="box-label">Front-Desk / Online Enrollment Form</text>

  <line x1="260" y1="175" x2="260" y2="205" stroke="#0284c7" stroke-width="1.8" marker-end="url(#arrow)" />

  <rect x="80" y="205" width="360" height="50" rx="6" fill="#ffffff" stroke="#99f6e4" />
  <text x="260" y="225" text-anchor="middle" class="box-label">Jakarta Bean Validation (@Valid DTO)</text>
  <text x="260" y="242" text-anchor="middle" class="box-desc">Format check, email uniqueness check</text>

  <line x1="260" y1="255" x2="260" y2="285" stroke="#0284c7" stroke-width="1.8" marker-end="url(#arrow)" />

  <rect x="80" y="285" width="360" height="50" rx="6" fill="#ffffff" stroke="#99f6e4" />
  <text x="260" y="305" text-anchor="middle" class="box-label">Password Hashing (BCrypt Work Factor 12)</text>
  <text x="260" y="322" text-anchor="middle" class="box-desc">Salted adaptive cryptographic hashing</text>

  <line x1="260" y1="335" x2="260" y2="365" stroke="#0284c7" stroke-width="1.8" marker-end="url(#arrow)" />

  <rect x="80" y="365" width="360" height="50" rx="6" fill="#ffffff" stroke="#99f6e4" />
  <text x="260" y="385" text-anchor="middle" class="box-label">Persist MemberProfile &amp; Digital QR Hash</text>
  <text x="260" y="402" text-anchor="middle" class="box-desc">Tied to specific gym_id and membership_plan_id</text>

  <line x1="260" y1="415" x2="260" y2="445" stroke="#0284c7" stroke-width="1.8" marker-end="url(#arrow)" />

  <rect x="80" y="445" width="360" height="45" rx="6" fill="#ccfbf1" stroke="#2dd4bf" />
  <text x="260" y="472" text-anchor="middle" class="box-label" fill="#115e59">HTTP 201 Created: Member Ready</text>

  <rect x="530" y="85" width="420" height="565" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5" />
  <text x="550" y="115" class="section-title" fill="#1d4ed8">2. Dual-Token Stateless Login Flow</text>

  <rect x="560" y="135" width="360" height="40" rx="6" fill="#ffffff" stroke="#bfdbfe" />
  <text x="740" y="160" text-anchor="middle" class="box-label">User Submits Credentials (email, password)</text>

  <line x1="740" y1="175" x2="740" y2="205" stroke="#0284c7" stroke-width="1.8" marker-end="url(#arrow)" />

  <rect x="560" y="205" width="360" height="50" rx="6" fill="#ffffff" stroke="#bfdbfe" />
  <text x="740" y="225" text-anchor="middle" class="box-label">Lookup User &amp; Compare BCrypt Hash</text>
  <text x="740" y="242" text-anchor="middle" class="box-desc">Verify is_active = TRUE and gym status</text>

  <line x1="740" y1="255" x2="740" y2="285" stroke="#0284c7" stroke-width="1.8" marker-end="url(#arrow)" />

  <rect x="560" y="285" width="360" height="50" rx="6" fill="#ffffff" stroke="#bfdbfe" />
  <text x="740" y="305" text-anchor="middle" class="box-label">Issue Signed Dual JWTs</text>
  <text x="740" y="322" text-anchor="middle" class="box-desc">Access: 15 mins (claims) &bull; Refresh: 7 days</text>

  <line x1="740" y1="335" x2="740" y2="365" stroke="#0284c7" stroke-width="1.8" marker-end="url(#arrow)" />

  <rect x="560" y="365" width="360" height="50" rx="6" fill="#ffffff" stroke="#bfdbfe" />
  <text x="740" y="385" text-anchor="middle" class="box-label">Store Refresh Token Hash in DB</text>
  <text x="740" y="402" text-anchor="middle" class="box-desc">Supports instant revocation &amp; rotation</text>

  <line x1="740" y1="415" x2="740" y2="445" stroke="#0284c7" stroke-width="1.8" marker-end="url(#arrow)" />

  <rect x="560" y="445" width="360" height="45" rx="6" fill="#dbeafe" stroke="#60a5fa" />
  <text x="740" y="472" text-anchor="middle" class="box-label" fill="#1e40af">HTTP 200 OK: Redirect to Role Dashboard</text>

</svg>