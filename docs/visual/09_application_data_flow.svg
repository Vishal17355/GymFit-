<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 20px; font-weight: bold; fill: #1e293b; }
      .subtitle { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 13px; fill: #64748b; }
      .box-label { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 600; }
      .box-desc { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 11px; fill: #475569; }
      .section-title { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 13px; font-weight: bold; fill: #334155; text-transform: uppercase; letter-spacing: 0.05em; }
      .arrow-text { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 11px; fill: #0284c7; font-weight: 500; }
      .mono { font-family: Consolas, 'Courier New', monospace; font-size: 11px; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0284c7" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10b981" />
    </marker>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#94a3b8" />
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.08" />
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="#f8fafc" rx="8" />
  
  <rect x="0" y="0" width="1000" height="64" fill="#ffffff" rx="8" />
  <line x1="0" y1="64" x2="1000" y2="64" stroke="#e2e8f0" stroke-width="1.5" />
  <circle cx="36" cy="32" r="14" fill="#3b82f6" />
  <text x="36" y="37" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="bold" fill="#ffffff">G</text>
  <text x="64" y="30" class="title">GymFit &bull; Overall Application Data Flow Diagram</text>
  <text x="64" y="48" class="subtitle">Multi-Gym Fitness Tracking &amp; Gym Management SaaS Platform</text>

  
  <rect x="40" y="90" width="165" height="560" rx="8" fill="#f8fafc" stroke="#cbd5e1" />
  <text x="122" y="115" text-anchor="middle" class="section-title">1. User Inputs</text>
  
  <rect x="50" y="135" width="145" height="45" rx="4" fill="#ffffff" stroke="#cbd5e1" />
  <text x="122" y="155" text-anchor="middle" class="box-desc" font-weight="600">Login Form</text>
  <text x="122" y="170" text-anchor="middle" class="box-desc">Email, Password</text>

  <rect x="50" y="200" width="145" height="45" rx="4" fill="#ffffff" stroke="#cbd5e1" />
  <text x="122" y="220" text-anchor="middle" class="box-desc" font-weight="600">QR Code Scan</text>
  <text x="122" y="235" text-anchor="middle" class="box-desc">Pass Check-in</text>

  <rect x="50" y="265" width="145" height="45" rx="4" fill="#ffffff" stroke="#cbd5e1" />
  <text x="122" y="285" text-anchor="middle" class="box-desc" font-weight="600">Workout Log</text>
  <text x="122" y="300" text-anchor="middle" class="box-desc">Sets, Reps, Load</text>

  <rect x="50" y="330" width="145" height="45" rx="4" fill="#ffffff" stroke="#cbd5e1" />
  <text x="122" y="350" text-anchor="middle" class="box-desc" font-weight="600">Class Booking</text>
  <text x="122" y="365" text-anchor="middle" class="box-desc">Class Slot Request</text>

  <rect x="50" y="395" width="145" height="45" rx="4" fill="#ffffff" stroke="#cbd5e1" />
  <text x="122" y="415" text-anchor="middle" class="box-desc" font-weight="600">Body Metrics</text>
  <text x="122" y="430" text-anchor="middle" class="box-desc">Weight, Body Fat %</text>

  <rect x="230" y="90" width="165" height="560" rx="8" fill="#fdf4ff" stroke="#f0abfc" />
  <text x="312" y="115" text-anchor="middle" class="section-title" fill="#a21caf">2. Gateway</text>
  
  <rect x="240" y="145" width="145" height="60" rx="4" fill="#ffffff" stroke="#e879f9" />
  <text x="312" y="170" text-anchor="middle" class="box-desc" font-weight="600">JWT Filter</text>
  <text x="312" y="188" text-anchor="middle" class="box-desc">Signature &amp; Expiry</text>

  <rect x="240" y="240" width="145" height="60" rx="4" fill="#ffffff" stroke="#e879f9" />
  <text x="312" y="265" text-anchor="middle" class="box-desc" font-weight="600">Tenant Filter</text>
  <text x="312" y="283" text-anchor="middle" class="box-desc">gymId Context</text>

  <rect x="240" y="335" width="145" height="60" rx="4" fill="#ffffff" stroke="#e879f9" />
  <text x="312" y="360" text-anchor="middle" class="box-desc" font-weight="600">Validation</text>
  <text x="312" y="378" text-anchor="middle" class="box-desc">Jakarta @Valid</text>

  <rect x="420" y="90" width="165" height="560" rx="8" fill="#eff6ff" stroke="#93c5fd" />
  <text x="502" y="115" text-anchor="middle" class="section-title" fill="#1d4ed8">3. Domain Engine</text>

  <rect x="430" y="145" width="145" height="45" rx="4" fill="#ffffff" stroke="#93c5fd" />
  <text x="502" y="172" text-anchor="middle" class="box-desc" font-weight="600">Auth / Security</text>

  <rect x="430" y="200" width="145" height="45" rx="4" fill="#ffffff" stroke="#93c5fd" />
  <text x="502" y="227" text-anchor="middle" class="box-desc" font-weight="600">Attendance Engine</text>

  <rect x="430" y="265" width="145" height="45" rx="4" fill="#ffffff" stroke="#93c5fd" />
  <text x="502" y="292" text-anchor="middle" class="box-desc" font-weight="600">Workout &amp; PR Engine</text>

  <rect x="430" y="330" width="145" height="45" rx="4" fill="#ffffff" stroke="#93c5fd" />
  <text x="502" y="357" text-anchor="middle" class="box-desc" font-weight="600">Booking Engine</text>

  <rect x="430" y="395" width="145" height="45" rx="4" fill="#ffffff" stroke="#93c5fd" />
  <text x="502" y="422" text-anchor="middle" class="box-desc" font-weight="600">Metrics Analytics</text>

  <rect x="610" y="90" width="165" height="560" rx="8" fill="#ecfdf5" stroke="#6ee7b7" />
  <text x="692" y="115" text-anchor="middle" class="section-title" fill="#047857">4. MySQL Storage</text>

  <rect x="620" y="145" width="145" height="45" rx="4" fill="#ffffff" stroke="#6ee7b7" />
  <text x="692" y="172" text-anchor="middle" class="box-desc" font-weight="600">users &amp; profiles</text>

  <rect x="620" y="200" width="145" height="45" rx="4" fill="#ffffff" stroke="#6ee7b7" />
  <text x="692" y="227" text-anchor="middle" class="box-desc" font-weight="600">attendances (gym_id)</text>

  <rect x="620" y="265" width="145" height="45" rx="4" fill="#ffffff" stroke="#6ee7b7" />
  <text x="692" y="292" text-anchor="middle" class="box-desc" font-weight="600">workout_set_logs</text>

  <rect x="620" y="330" width="145" height="45" rx="4" fill="#ffffff" stroke="#6ee7b7" />
  <text x="692" y="357" text-anchor="middle" class="box-desc" font-weight="600">class_bookings</text>

  <rect x="620" y="395" width="145" height="45" rx="4" fill="#ffffff" stroke="#6ee7b7" />
  <text x="692" y="422" text-anchor="middle" class="box-desc" font-weight="600">body_metrics</text>

  <rect x="800" y="90" width="165" height="560" rx="8" fill="#f8fafc" stroke="#cbd5e1" />
  <text x="882" y="115" text-anchor="middle" class="section-title">5. Client Insights</text>

  <rect x="810" y="145" width="145" height="45" rx="4" fill="#ffffff" stroke="#cbd5e1" />
  <text x="882" y="172" text-anchor="middle" class="box-desc" font-weight="600">Role Dashboards</text>

  <rect x="810" y="200" width="145" height="45" rx="4" fill="#ffffff" stroke="#cbd5e1" />
  <text x="882" y="227" text-anchor="middle" class="box-desc" font-weight="600">Live Occupancy</text>

  <rect x="810" y="265" width="145" height="45" rx="4" fill="#ffffff" stroke="#cbd5e1" />
  <text x="882" y="292" text-anchor="middle" class="box-desc" font-weight="600">PR Milestone Cards</text>

  <rect x="810" y="330" width="145" height="45" rx="4" fill="#ffffff" stroke="#cbd5e1" />
  <text x="882" y="357" text-anchor="middle" class="box-desc" font-weight="600">Class Timetable</text>

  <rect x="810" y="395" width="145" height="45" rx="4" fill="#ffffff" stroke="#cbd5e1" />
  <text x="882" y="422" text-anchor="middle" class="box-desc" font-weight="600">Trend Progression</text>

</svg>