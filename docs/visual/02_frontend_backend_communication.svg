<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 20px; font-weight: bold; fill: #1e293b; }
      .subtitle { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 13px; fill: #64748b; }
      .box-label { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 600; }
      .box-desc { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 11px; fill: #475569; }
      .section-title { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 13px; font-weight: bold; fill: #334155; text-transform: uppercase; letter-spacing: 0.05em; }
      .arrow-text { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 11px; fill: #0284c7; font-weight: 500; }
      .mono { font-family: Consolas, 'Courier New', monospace; font-size: 11px; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0284c7" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10b981" />
    </marker>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#94a3b8" />
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.08" />
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="#f8fafc" rx="8" />
  
  <rect x="0" y="0" width="1000" height="64" fill="#ffffff" rx="8" />
  <line x1="0" y1="64" x2="1000" y2="64" stroke="#e2e8f0" stroke-width="1.5" />
  <circle cx="36" cy="32" r="14" fill="#3b82f6" />
  <text x="36" y="37" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="bold" fill="#ffffff">G</text>
  <text x="64" y="30" class="title">GymFit &bull; Frontend & Backend Communication Flow</text>
  <text x="64" y="48" class="subtitle">Multi-Gym Fitness Tracking &amp; Gym Management SaaS Platform</text>

  
  <line x1="120" y1="90" x2="120" y2="630" stroke="#cbd5e1" stroke-dasharray="4 4" />
  <line x1="320" y1="90" x2="320" y2="630" stroke="#cbd5e1" stroke-dasharray="4 4" />
  <line x1="520" y1="90" x2="520" y2="630" stroke="#cbd5e1" stroke-dasharray="4 4" />
  <line x1="720" y1="90" x2="720" y2="630" stroke="#cbd5e1" stroke-dasharray="4 4" />
  <line x1="880" y1="90" x2="880" y2="630" stroke="#cbd5e1" stroke-dasharray="4 4" />

  <rect x="50" y="80" width="140" height="40" rx="6" fill="#e0f2fe" stroke="#38bdf8" />
  <text x="120" y="105" text-anchor="middle" class="box-label" fill="#0369a1">React SPA</text>

  <rect x="240" y="80" width="160" height="40" rx="6" fill="#f3e8ff" stroke="#c084fc" />
  <text x="320" y="105" text-anchor="middle" class="box-label" fill="#7e22ce">Security &amp; JWT Filter</text>

  <rect x="440" y="80" width="160" height="40" rx="6" fill="#fdf4ff" stroke="#f472b6" />
  <text x="520" y="105" text-anchor="middle" class="box-label" fill="#be185d">TenantContext Filter</text>

  <rect x="640" y="80" width="160" height="40" rx="6" fill="#e0e7ff" stroke="#818cf8" />
  <text x="720" y="105" text-anchor="middle" class="box-label" fill="#4338ca">Service / Module</text>

  <rect x="810" y="80" width="140" height="40" rx="6" fill="#dcfce7" stroke="#4ade80" />
  <text x="880" y="105" text-anchor="middle" class="box-label" fill="#15803d">MySQL 8.x DB</text>

  <line x1="120" y1="160" x2="315" y2="160" stroke="#0284c7" stroke-width="1.8" marker-end="url(#arrow)" />
  <text x="215" y="152" text-anchor="middle" class="arrow-text">1. GET /api/v1/workouts (Bearer JWT)</text>

  <rect x="260" y="180" width="120" height="35" rx="4" fill="#ffffff" stroke="#c084fc" />
  <text x="320" y="196" text-anchor="middle" class="box-desc" font-weight="600">Validate JWT Signature</text>
  <text x="320" y="208" text-anchor="middle" class="box-desc">Verify Claims &amp; Expiry</text>

  <line x1="320" y1="235" x2="515" y2="235" stroke="#0284c7" stroke-width="1.8" marker-end="url(#arrow)" />
  <text x="420" y="227" text-anchor="middle" class="arrow-text">2. Token Validated; Forward Context</text>

  <rect x="450" y="255" width="140" height="35" rx="4" fill="#ffffff" stroke="#f472b6" />
  <text x="520" y="271" text-anchor="middle" class="box-desc" font-weight="600">Extract gymId from JWT</text>
  <text x="520" y="283" text-anchor="middle" class="box-desc">Set ThreadLocal TenantContext</text>

  <line x1="520" y1="310" x2="715" y2="310" stroke="#0284c7" stroke-width="1.8" marker-end="url(#arrow)" />
  <text x="620" y="302" text-anchor="middle" class="arrow-text">3. Route to WorkoutController</text>

  <rect x="660" y="330" width="120" height="35" rx="4" fill="#ffffff" stroke="#818cf8" />
  <text x="720" y="346" text-anchor="middle" class="box-desc" font-weight="600">@PreAuthorize RBAC</text>
  <text x="720" y="358" text-anchor="middle" class="box-desc">Enable Hibernate @Filter</text>

  <line x1="720" y1="385" x2="875" y2="385" stroke="#0284c7" stroke-width="1.8" marker-end="url(#arrow)" />
  <text x="797" y="377" text-anchor="middle" class="arrow-text">4. SQL WHERE gym_id = :gymId</text>

  <line x1="880" y1="435" x2="725" y2="435" stroke="#10b981" stroke-width="1.8" stroke-dasharray="4 2" marker-end="url(#arrow-green)" />
  <text x="797" y="427" text-anchor="middle" class="arrow-text" fill="#10b981">5. Isolated Tenant Records</text>

  <rect x="650" y="455" width="140" height="35" rx="4" fill="#ffffff" stroke="#818cf8" />
  <text x="720" y="471" text-anchor="middle" class="box-desc" font-weight="600">Map Entity to Record DTO</text>
  <text x="720" y="483" text-anchor="middle" class="box-desc">Clear TenantContext in finally</text>

  <line x1="720" y1="515" x2="125" y2="515" stroke="#10b981" stroke-width="1.8" stroke-dasharray="4 2" marker-end="url(#arrow-green)" />
  <text x="420" y="507" text-anchor="middle" class="arrow-text" fill="#10b981">6. HTTP 200 OK (Clean JSON DTO Response)</text>

  <rect x="50" y="540" width="140" height="40" rx="4" fill="#ffffff" stroke="#38bdf8" />
  <text x="120" y="558" text-anchor="middle" class="box-desc" font-weight="600">Render Dynamic UI</text>
  <text x="120" y="570" text-anchor="middle" class="box-desc">Update Client State Cache</text>

</svg>